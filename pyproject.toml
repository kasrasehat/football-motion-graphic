[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tactic-motion-studio"
version = "0.1.0"
description = "Soccer tactic explainers and match previews as motion graphics with voice-over and music."
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "hypothesis>=6.100,<7", "pytest-asyncio>=0.25,<2"]

[project.scripts]
tms = "tms.cli:main"

[tool.setuptools.packages.find]
where = ["engine"]

[tool.setuptools.package-data]
match_data_collector = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "vendor/match-collector/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
  "fast: quick unit tests run by the Stop hook",
  "render: tests that invoke Remotion (slow)",
  "e2e: full pipeline runs (slow)",
  "live: tests that hit paid/quota APIs (never run by default)",
]
