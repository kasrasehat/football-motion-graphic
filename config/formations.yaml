# Default blocks (line_x, depth, width, ball_shift) per phase for the team IN possession and OUT of possession,
# each in its own team-normalized frame (line_x measured from the team's own goal line).
phase_blocks:
  build_up:       {in_possession: [25, 43, 56, 0.2], out_of_possession: [30, 25, 44, 0.3]}
  progression:    {in_possession: [36, 38, 60, 0.2], out_of_possession: [24, 24, 42, 0.35]}
  final_third:    {in_possession: [50, 36, 62, 0.2], out_of_possession: [12, 22, 40, 0.4]}
  high_press:     {in_possession: [13, 40, 58, 0.1], out_of_possession: [46, 30, 52, 0.35]}
  mid_block:      {in_possession: [30, 40, 60, 0.2], out_of_possession: [28, 26, 44, 0.3]}
  low_block:      {in_possession: [48, 36, 62, 0.2], out_of_possession: [12, 22, 40, 0.35]}
  counter_press:  {in_possession: [24, 36, 50, 0.3], out_of_possession: [48, 30, 50, 0.4]}
  def_transition: {in_possession: [40, 40, 56, 0.3], out_of_possession: [38, 34, 52, 0.4]}
  att_transition: {in_possession: [30, 46, 56, 0.3], out_of_possession: [44, 36, 54, 0.3]}

# Who carries the ball by default in each phase (first role found in the team in possession).
default_holder:
  build_up: [RCB, LCB, CB, GK]
  progression: [DM, RDM, LDM, RCM, LCM, CM]
  final_third: [AM, RCM, LCM, RW, LW, ST]
  high_press: [RCB, LCB, CB, GK]
  mid_block: [RCB, LCB, CB, DM]
  low_block: [AM, RCM, LCM, RW, LW, DM]
  counter_press: [DM, RCM, LCM, CM, AM]
  def_transition: [AM, RCM, LCM, ST, RW, LW]
  att_transition: [DM, RCM, LCM, AM, ST]

in_possession_phases: [build_up, progression, final_third, att_transition, corner, free_kick]
