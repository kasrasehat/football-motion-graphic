# Formation templates in a normalized block space (team-normalized frame: the team attacks +x).
#   u = depth fraction within the block (0 = back line, 1 = most advanced player)
#   v = fraction across the block width (0 = the team's LEFT touchline side = small y, 1 = right)
# The shape solver maps a template + block {line_x, depth, width, ball_shift} to metres:
#   x = line_x + u * depth ;  y = 34 + (v - 0.5) * width + lateral ball shift
# The goalkeeper is placed by `goalkeeper` below. `line` numbers count from the back (GK = 0).

goalkeeper: {x_min: 4.0, x_max: 16.0, gap: 20.0, follow_shift: 0.3}
lateral_shift_gain: 0.6       # metres of block shift per metre of ball offset from centre, times ball_shift
separation: {teammates_m: 4.5, opponents_m: 2.0, iterations: 12}

# Classic shirt-number preferences per role (first free number wins); ids are H<number>/A<number>.
