# Every validator rule: id -> artifact, severity, description, numeric params.
# Validators read params from here; skills quote them; tests/contract/test_rules_registry.py requires
# every id to have an implementation AND a negative test in tests/**/test_rules_*.py.
# severity: error blocks `tms stage submit`; warning is surfaced to QA reviewers and the human gate.
rules:
  # ---------------- brief ----------------
  BR-01: {artifact: brief, severity: error, text: "target_duration_s within the mode's duration range (pipeline.yaml)"}
  BR-02: {artifact: brief, severity: error, text: "team fill colours distinguishable (CIEDE2000)", params: {min_delta_e: 25}}
  BR-03: {artifact: brief, severity: error, text: "shirt-number text readable on fill (WCAG contrast)", params: {min_contrast: 4.5}}
  BR-04: {artifact: brief, severity: error, text: "team short codes distinct"}
  BR-05: {artifact: brief, severity: error, text: "tactic source consistent: user => tactic_text >= 20 chars; ai => topic set", params: {min_tactic_text: 20}}
  BR-06: {artifact: brief, severity: error, text: "match: home != away; kickoff within [resolved_at - 6h, resolved_at + 14d]", params: {before_h: 6, after_days: 14}}
  BR-07: {artifact: brief, severity: error, text: "music.source=file => file exists and decodes, >= 20 s", params: {min_s: 20}}
  BR-08: {artifact: brief, severity: warning, text: "TTS budget covers the target duration (chars ~ 16/s x 1.3)", params: {chars_per_s: 16, margin: 1.3}}
  BR-09: {artifact: brief, severity: error, text: "match resolution evidence: api => fixture_id set; web => >= 2 sources", params: {web_min_sources: 2}}
  BR-10: {artifact: brief, severity: error, text: "project_id matches the project folder"}
  BR-11: {artifact: brief, severity: error, text: "brief.mode equals the project's mode"}
