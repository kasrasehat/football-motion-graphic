[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "match-collector"
version = "0.1.0"
description = "Match-driven football data and news extraction with source evidence"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29", "beautifulsoup4>=4.13,<5",
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "rapidfuzz>=3.12,<4", "python-dateutil>=2.9,<3", "tzdata>=2025.1",
  "playwright>=1.50,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
match-collector = "match_collector.cli:main"

[tool.setuptools.packages.find]
include = ["match_collector*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

