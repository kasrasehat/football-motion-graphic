## Write claims
Same format as web_claims, `category: "quote"`, `fact_key` = `fixture.expert.<topic>`, or `T.expert.<topic>` if it is about one team:
- Value: one plain sentence in your own words that names the person and the outlet ("On Sky Sports, Gary Neville expects ...").
- `sources[].quote`: a short verbatim line that supports it. Never reproduce a whole answer or article.
- `as_of`: when they said it. A view from before a team's latest match is stale: say so, or leave it out.
- An expert's number stays their claim. It never feeds the prediction, and it is never shown as our statistic.

## Never include
Unnamed "experts", betting tips or tipster previews, social media posts, generated previews, or a view you could not open and read.
If a page is blocked, use another source: never work around a block.

## Output
Return ONLY `{"scope":"expert","claims":[...],"gaps":["what you could not find and why"]}`.
